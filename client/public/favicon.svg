<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="24" fill="#0c1410"/>
  <rect x="8" y="8" width="104" height="104" rx="18" fill="#14201a" stroke="#C27107" stroke-width="3" stroke-opacity="0.6"/>
  <!-- 3 GGF Orange Blocks -->
  <g id="ggf-cubes">
    <!-- First G Box -->
    <rect x="18" y="28" width="26" height="42" rx="4" fill="#C27107"/>
    <text x="31" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">G</text>
    
    <!-- Second G Box -->
    <rect x="47" y="28" width="26" height="42" rx="4" fill="#C27107"/>
    <text x="60" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">G</text>
    
    <!-- Third F Box -->
    <rect x="76" y="28" width="26" height="42" rx="4" fill="#C27107"/>
    <text x="89" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">F</text>
  </g>
  <!-- GROUP Subtitle -->
  <text x="89" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">GROUP</text>
  <!-- Forest Leaf Accent -->
  <circle cx="28" cy="85" r="4" fill="#A5C639"/>
  <circle cx="42" cy="85" r="4" fill="#FFB300"/>
</svg>